name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "选择构建分支（如 zh-cn）"
        required: true
        default: "zh-cn"

permissions:
  contents: write

jobs:
  build-and-create-release:
    runs-on: windows-latest

    steps:
      # 1. Checkout 指定分支
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      # 2. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle cache
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6

      # 4. Build EXE
      - name: Build with Gradle (createDistributable)
        run: ./gradlew.bat :compose:createDistributable

      # 5. Copy readme
      - name: Copy readme.txt to distribution directory
        run: |
          Copy-Item -Path compose/readme.txt -Destination compose/build/compose/binaries/main/app/umasim/

      # 6. Zip
      - name: Zip application directory
        run: |
          Compress-Archive -Path compose/build/compose/binaries/main/app/umasim -DestinationPath umasim.zip

      # 7. Create Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: "自动构建版本（分支：${{ inputs.branch }}）"
          draft: false
          prerelease: false
          files: |
            umasim.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
